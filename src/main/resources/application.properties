# ================================================================
#  APPLICATION PROPERTIES — AI Notes Summarizer
# ================================================================
#  This file configures Spring Boot's auto-configuration system.
#  Spring Boot reads these properties at startup and uses them to
#  set up the database connection, security, AI client, etc.
#
#  IMPORTANT: Sensitive values (API keys, JWT secret) are read from
#  ENVIRONMENT VARIABLES using ${VAR_NAME} syntax. Never hardcode them.
# ================================================================

# ---------- Application Info ----------
spring.application.name=AI Notes Summarizer
# Port 9090 used because a separate Tomcat installation occupies 8080
server.port=9090

# ================================================================
#  DATABASE — MySQL Configuration
# ================================================================
#  spring.datasource.url    → JDBC connection string
#  spring.datasource.username/password → MySQL credentials
#
#  The URL format is: jdbc:mysql://HOST:PORT/DATABASE_NAME
#  Make sure the database "notesai_db" exists in MySQL before starting.
#  You can create it with: CREATE DATABASE notesai_db;

spring.datasource.url=jdbc:mysql://localhost:3306/notesai_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================================
#  JPA / HIBERNATE Configuration
# ================================================================
#  ddl-auto=update → Hibernate will automatically create/update tables
#                    based on your @Entity classes. This is great for
#                    development but NEVER use it in production (use
#                    Flyway or Liquibase migrations instead).
#
#  show-sql=true   → Prints the SQL queries Hibernate generates to the
#                    console. Useful for debugging and learning.
#
#  format_sql=true → Makes the printed SQL queries readable (indented).
#
#  dialect → Tells Hibernate which SQL dialect to use for MySQL 8.x

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Note: hibernate.dialect is NOT set because Hibernate 6.x auto-detects it
# from the JDBC connection. Setting it explicitly causes a deprecation warning.
#
# Disable open-in-view to avoid lazy-loading issues and suppress startup warning
spring.jpa.open-in-view=false

# ================================================================
#  JWT (JSON Web Token) Configuration
# ================================================================
#  jwt.secret     → The secret key used to sign/verify JWT tokens.
#                   MUST be a Base64-encoded string of at least 256 bits.
#                   Set this as an environment variable: JWT_SECRET
#
#  jwt.expiration → Token validity in milliseconds.
#                   86400000 ms = 24 hours
#
#  TO GENERATE A SECURE SECRET (run in terminal):
#  On Windows PowerShell:
#    [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }) -as [byte[]])
#
#  Or just use any Base64 string of 32+ characters, like:
#    bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZzEyMzQ1Njc4OTA=

jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZzEyMzQ1Njc4OTA=}
jwt.expiration=86400000

# ================================================================
#  SPRING AI — Groq Configuration (OpenAI-compatible)
# ================================================================
#  WHY GROQ?
#  Groq offers a free tier (no credit card) with fast inference.
#  Its API is OpenAI-compatible, so Spring AI's OpenAI starter works
#  unchanged — we just point base-url at Groq instead of OpenAI.
#
#  base-url → Groq's OpenAI-compatible endpoint
#  api-key  → Your Groq API key (get it from https://console.groq.com)
#  model    → The LLM model to use (llama-3.3-70b-versatile is free)
#
#  SET YOUR API KEY as an environment variable:
#    Windows CMD:    set GROQ_API_KEY=gsk_your_key_here
#    Windows PS:     $env:GROQ_API_KEY="gsk_your_key_here"
#    Linux/Mac:      export GROQ_API_KEY=gsk_your_key_here

# IMPORTANT: Do NOT include /v1 in the base-url!
# Spring AI's OpenAI client appends /v1/chat/completions internally.
# If you add /v1 here, the URL becomes /v1/v1/chat/completions (broken!).
spring.ai.openai.base-url=https://api.groq.com/openai
# GROQ_API_KEY must be set as an environment variable.
# On Windows PowerShell: $env:GROQ_API_KEY="gsk_..."
# Or set permanently: [System.Environment]::SetEnvironmentVariable("GROQ_API_KEY","gsk_...","User")
spring.ai.openai.api-key=${GROQ_API_KEY:MISSING_SET_GROQ_API_KEY_ENV_VAR}
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

# ================================================================
#  FILE UPLOAD Configuration (for PDF uploads in Stage 3)
# ================================================================
#  max-file-size     → Maximum size of a single uploaded file (10 MB)
#  max-request-size  → Maximum size of the entire multipart request

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ================================================================
#  SWAGGER / OPENAPI Configuration
# ================================================================
#  These settings configure the auto-generated API documentation.
#  After starting the app, visit: http://localhost:9090/swagger-ui.html

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
