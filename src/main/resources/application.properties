# ============================================
# AI Notes Summarizer — Application Properties
# ============================================

spring.application.name=AI Notes Summarizer
server.port=${PORT:9090}

# ---------- Database ----------
# Local dev defaults to MySQL. On Render, set SPRING_DATASOURCE_* env vars
# to point at the free PostgreSQL instance instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notesai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT Config ----------
jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZzEyMzQ1Njc4OTA=}
jwt.expiration=86400000

# ---------- Spring AI (Groq — OpenAI compatible) ----------
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:MISSING_SET_GROQ_API_KEY_ENV_VAR}
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
