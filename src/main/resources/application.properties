# ============================================
# AI Notes Summarizer — Application Properties
# ============================================

spring.application.name=AI Notes Summarizer
server.port=9090

# ---------- MySQL Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/notesai_db
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# ddl-auto=update lets Hibernate create/update tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- JWT Config ----------
# secret must be Base64-encoded, at least 256 bits for HS256
jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuU2lnbmluZzEyMzQ1Njc4OTA=}
jwt.expiration=86400000

# ---------- Spring AI (Groq — OpenAI compatible) ----------
# Groq's API works with the OpenAI starter, just need to change base-url
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:MISSING_SET_GROQ_API_KEY_ENV_VAR}
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

# ---------- File Upload ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Swagger ----------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
